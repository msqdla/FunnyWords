<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Sharon老师抖音英语单词学习库：查单词、学搭配、例句记忆，附原视频跳转。">
<title>单词库 — 老达·英语学习</title>
<style>
  :root{
    --bg:#f7f8fa; --card:#fff; --primary:#fe2c55; --ink:#161823;
    --muted:#8a8f99; --line:#ebedf0; --ok:#00b96b; --accent:#25f4ee;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:70px}
  header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px;z-index:10}
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:19px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  h1 .sub{font-size:12px;color:var(--muted);font-weight:normal}
  .toolbar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  #search{flex:1;min-width:220px;padding:9px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px;outline:none}
  #search:focus{border-color:var(--primary)}
  .filters{display:flex;gap:6px;flex-wrap:wrap}
  .filters button{padding:7px 13px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:13px;cursor:pointer;color:var(--muted)}
  .filters button.active{background:var(--ink);color:#fff;border-color:var(--ink)}

  main{max-width:820px;margin:16px auto;padding:0 14px}

  /* 视频卡片（分组） */
  .video-card{background:linear-gradient(135deg,#161823,#2b2e3f);color:#fff;border-radius:14px;padding:16px 18px;margin-bottom:14px}
  .video-card h2{font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .video-card .tag{font-size:11px;background:var(--primary);padding:2px 8px;border-radius:6px}
  .video-card .summary{margin-top:8px;font-size:13.5px;line-height:1.7;color:#c8cbd4}
  .video-card .meta{margin-top:8px;font-size:12px;color:#8a8f99;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
  .video-card a{color:var(--accent);text-decoration:none}
  .video-card a:hover{text-decoration:underline}
  .word-chips{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:12px;background:rgba(255,255,255,.12);padding:4px 10px;border-radius:14px;cursor:pointer}
  .chip:hover{background:rgba(255,255,255,.25)}

  /* 词条卡片 */
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
  .word-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .word{font-size:22px;font-weight:700}
  .pos{font-size:12px;color:var(--primary);background:#fff1f3;padding:2px 8px;border-radius:6px}
  .ipa{color:var(--muted);font-size:15px}
  .speak{border:none;background:none;cursor:pointer;font-size:16px;color:var(--primary);padding:0 4px}
  .meaning{margin-top:6px;font-size:15px}
  .example{margin-top:10px;padding:10px 12px;background:var(--bg);border-radius:8px;font-size:14px;line-height:1.6}
  .example .en{font-style:italic}
  .example .zh{color:var(--muted);margin-top:2px}
  .note{margin-top:8px;padding:10px 12px;background:#fffbf0;border-radius:8px;font-size:13.5px;line-height:1.6}
  .meta{margin-top:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  .source{font-size:12px;color:var(--muted)}
  .source a{color:var(--muted)}
  .actions button{font-size:12px;padding:5px 11px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--muted)}
  .actions button.mastered{background:var(--ok);color:#fff;border-color:var(--ok)}
  .card.done{opacity:.55}

  footer{max-width:820px;margin:24px auto 0;padding:0 14px;font-size:12px;color:var(--muted);line-height:1.9}
  .empty{text-align:center;color:var(--muted);padding:50px 0;font-size:14px}
  .stats{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>📖 Sharon老师单词库
      <span class="sub">查单词 · 学搭配 · 跳转原视频</span>
    </h1>
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <input id="search" placeholder="搜索单词 / 释义 / 例句…（如：run out、用完）">
      <div class="filters">
        <button class="active" data-f="all">全部</button>
        <button data-f="undone">未掌握</button>
        <button data-f="done">已掌握</button>
        <button data-f="grouped">按视频分组</button>
      </div>
    </div>
  </div>
</header>
<main id="list"></main>
<footer>
  本站为学习索引工具：仅收录文字化词条（释义/例句/笔记），视频版权归创作者所有，点击来源链接前往抖音原视频观看学习。<br>
  数据持续更新中 · "已掌握"记录保存在本机浏览器
</footer>
<script src="data.js"></script>
<script>
const KEY = "sharon_words_done_v1";
let done = JSON.parse(localStorage.getItem(KEY) || "{}");
let filter = "all", query = "";

const save = () => localStorage.setItem(KEY, JSON.stringify(done));
const speak = t => { const u = new SpeechSynthesisUtterance(t); u.lang="en-US"; u.rate=.9; speechSynthesis.speak(u); };
const videoOf = id => VIDEOS[id] || {title:"未知视频", url:"#", date:"", summary:""};

function wordCard(w){
  const isDone = !!done[w.word];
  const v = videoOf(w.videoId);
  const el = document.createElement("div");
  el.className = "card" + (isDone ? " done" : "");
  el.innerHTML = `
    <div class="word-row">
      <span class="word">${w.word}</span>
      <span class="pos">${w.pos}</span>
      <span class="ipa">${w.ipa}</span>
      <button class="speak" title="发音">🔊</button>
    </div>
    <div class="meaning"><b>${w.meaning}</b></div>
    <div class="example"><div class="en">${w.exampleEn}</div><div class="zh">${w.exampleZh}</div></div>
    ${w.note ? `<div class="note">💡 ${w.note}</div>` : ""}
    <div class="meta">
      <span class="source">来源：<a href="${v.url}" target="_blank">《${v.title}》${v.date}</a></span>
      <div class="actions"><button class="mb ${isDone?"mastered":""}">${isDone?"✓ 已掌握":"标记掌握"}</button></div>
    </div>`;
  el.querySelector(".speak").onclick = ()=> speak(w.word);
  el.querySelector(".mb").onclick = ()=>{ done[w.word] ? delete done[w.word] : done[w.word]=1; save(); render(); };
  return el;
}

function videoBlock(vid, words){
  const v = VIDEOS[vid];
  const el = document.createElement("div");
  el.className = "video-card";
  el.innerHTML = `
    <h2>🎬 ${v.title} <span class="tag">${v.date}</span></h2>
    <div class="summary">📌 一句话总结：${v.summary}</div>
    <div class="word-chips">${words.map(w=>`<span class="chip" data-w="${w.word}">${w.word}</span>`).join("")}</div>
    <div class="meta">
      <span>${words.length} 个词条</span>
      <a href="${v.url}" target="_blank">▶ 前往抖音观看原视频</a>
    </div>`;
  el.querySelectorAll(".chip").forEach(c=>{
    c.onclick = ()=>{
      document.getElementById("search").value = c.dataset.w;
      query = c.dataset.w; filter = "all"; render();
      window.scrollTo({top:0, behavior:"smooth"});
    };
  });
  return el;
}

function render(){
  const list = document.getElementById("list");
  list.innerHTML = "";
  const q = query.toLowerCase();
  const match = w => (w.word+" "+w.meaning+" "+w.exampleEn+" "+w.exampleZh+" "+(w.note||"")).toLowerCase().includes(q);
  const shown = WORDS.filter(w=>{
    if(filter==="done" && !done[w.word]) return false;
    if(filter==="undone" && done[w.word]) return false;
    return !q || match(w);
  });
  const learned = Object.keys(done).length;
  document.getElementById("stats").textContent =
    `共 ${WORDS.length} 个词条 · ${Object.keys(VIDEOS).length} 个视频 · 已掌握 ${learned} 个`;
  if(!shown.length){ list.innerHTML = `<div class="empty">没有匹配的词条</div>`; return; }

  if(filter==="grouped"){
    const byVid = {};
    shown.forEach(w=>{ (byVid[w.videoId] = byVid[w.videoId] || []).push(w); });
    for(const vid of Object.keys(byVid)){
      list.appendChild(videoBlock(vid, byVid[vid]));
      byVid[vid].forEach(w=> list.appendChild(wordCard(w)));
    }
  } else {
    shown.forEach(w=> list.appendChild(wordCard(w)));
  }
}

document.getElementById("search").addEventListener("input", e=>{ query=e.target.value; render(); });
document.querySelectorAll(".filters button").forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active"); filter=b.dataset.f; render();
  };
});
render();
</script>
</body>
</html>
