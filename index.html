<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="单词一学会：查单词、学搭配、看讲解，附抖音原视频跳转。">
<title>单词一学会 — 查单词·学英语</title>
<style>
  :root{
    --bg:#f7f8fa; --card:#fff; --primary:#fe2c55; --ink:#161823;
    --muted:#8a8f99; --line:#ebedf0; --ok:#00b96b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:60px}
  header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px;z-index:10}
  .wrap{max-width:960px;margin:0 auto}
  h1{font-size:20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  h1 .sub{font-size:12px;color:var(--muted);font-weight:normal}
  .stats{font-size:12px;color:var(--muted);margin-top:4px}
  .toolbar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  #search{flex:1;min-width:220px;padding:9px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px;outline:none}
  #search:focus{border-color:var(--primary)}
  .filters{display:flex;gap:6px}
  .filters button{padding:7px 13px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:13px;cursor:pointer;color:var(--muted)}
  .filters button.active{background:var(--ink);color:#fff;border-color:var(--ink)}

  main{max-width:960px;margin:16px auto;padding:0 14px}

  /* 表格 */
  .table-wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:14px}
  thead th{background:var(--bg);text-align:left;padding:10px 14px;font-size:12.5px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
  tbody tr:last-child td{border-bottom:none}
  tbody tr.row{cursor:pointer;transition:background .15s}
  tbody tr.row:hover{background:#fafbfc}
  tbody tr.row.done{opacity:.5}
  .w{font-size:16px;font-weight:700;white-space:nowrap}
  .w .n{font-size:11px;color:var(--primary);background:#fff1f3;border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:600}
  .m{color:var(--ink);min-width:120px}
  .s{color:var(--muted);font-size:13px;line-height:1.6}
  .s .vt{color:var(--ink);font-weight:600}
  .lk{white-space:nowrap}
  .lk a{font-size:13px;color:var(--primary);text-decoration:none;font-weight:600}
  .lk a:hover{text-decoration:underline}
  .say{border:none;background:none;color:var(--primary);cursor:pointer;font-size:15px;padding:0 2px;vertical-align:middle}

  /* 展开详情行 */
  tr.detail>td{background:#fafbfc;padding:14px 18px 18px}
  .d-block{margin-bottom:12px}
  .d-block:last-child{margin-bottom:0}
  .d-head{font-size:13px;font-weight:700;margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .d-head .dtitle{color:var(--primary)}
  .ipa{color:var(--muted);font-size:13px;font-weight:normal}
  .pos{font-size:11px;color:var(--primary);background:#fff1f3;padding:1px 7px;border-radius:6px}
  .ex{padding:9px 12px;background:#fff;border:1px solid var(--line);border-radius:8px;font-size:13.5px;line-height:1.6}
  .ex .en{font-style:italic}
  .ex .zh{color:var(--muted);margin-top:2px}
  .note{margin-top:6px;font-size:12.5px;color:#8a6d1a;background:#fffbf0;border-radius:8px;padding:8px 12px;line-height:1.6}
  .d-actions{margin-top:10px;display:flex;gap:8px}
  .d-actions button{font-size:12px;padding:5px 11px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--muted)}
  .d-actions button.mastered{background:var(--ok);color:#fff;border-color:var(--ok)}

  footer{max-width:960px;margin:22px auto 0;padding:0 14px;font-size:12px;color:var(--muted);line-height:1.9}
  .empty{text-align:center;color:var(--muted);padding:50px 0;font-size:14px;background:var(--card);border-radius:12px;border:1px solid var(--line)}

  /* 手机端：表格横向滚动 */
  .table-scroll{overflow-x:auto}
  @media(max-width:640px){
    table{min-width:640px}
    h1{font-size:17px}
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>📕 单词一学会 <span class="sub">查单词 · 学搭配 · 跳转原视频</span></h1>
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <input id="search" placeholder="搜索单词 / 释义 / 例句…（如：run out、用完）">
      <div class="filters">
        <button class="active" data-f="all">全部</button>
        <button data-f="undone">未掌握</button>
        <button data-f="done">已掌握</button>
      </div>
    </div>
  </div>
</header>
<main>
  <div class="table-wrap table-scroll">
    <table>
      <thead>
        <tr>
          <th style="width:22%">单词</th>
          <th style="width:22%">大意</th>
          <th>视频简介</th>
          <th style="width:12%">原视频</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</main>
<footer>
  本站为学习索引工具：仅收录文字化词条（释义/例句/笔记），视频版权归创作者所有，点击链接前往抖音原视频观看学习。<br>
  数据持续更新中 · 点表格行可展开音标、例句和笔记 · "已掌握"记录保存在本机浏览器
</footer>
<script src="data.js"></script>
<script>
const KEY = "danci_done_v1";
let done = JSON.parse(localStorage.getItem(KEY) || "{}");
let filter = "all", query = "", expanded = new Set();

const save = () => localStorage.setItem(KEY, JSON.stringify(done));
const speak = t => { const u = new SpeechSynthesisUtterance(t); u.lang="en-US"; u.rate=.9; speechSynthesis.speak(u); };
const videoOf = id => VIDEOS[id] || {title:"未知视频", url:"#", date:"", summary:""};

function render(){
  const tb = document.getElementById("tbody");
  tb.innerHTML = "";
  const q = query.toLowerCase();
  const match = w => {
    const det = w.details.map(d=>{
      const v = videoOf(d.videoId);
      return (v.title+" "+v.summary+" "+d.exampleEn+" "+d.exampleZh+" "+(d.note||""));
    }).join(" ");
    return (w.word+" "+w.meaning+" "+det).toLowerCase().includes(q);
  };
  const shown = WORDS.filter(w=>{
    if(filter==="done" && !done[w.word]) return false;
    if(filter==="undone" && done[w.word]) return false;
    return !q || match(w);
  });
  document.getElementById("stats").textContent =
    `共 ${WORDS.length} 个单词 · 来自 ${Object.keys(VIDEOS).length} 个视频 · 已掌握 ${Object.keys(done).length}`;
  if(!shown.length){
    tb.innerHTML = `<tr><td colspan="4"><div class="empty">没有匹配的单词</div></td></tr>`;
    return;
  }
  for(const w of shown){
    const isDone = !!done[w.word];
    const open = expanded.has(w.word);
    const firstV = videoOf(w.details[0].videoId);
    const sumText = w.details.length === 1
      ? `<span class="vt">《${firstV.title}》</span> ${firstV.summary}`
      : w.details.map(d=>{
          const v = videoOf(d.videoId);
          return `<div style="margin-bottom:4px">· <span class="vt">《${v.title}》</span> ${v.summary}</div>`;
        }).join("");
    const row = document.createElement("tr");
    row.className = "row" + (isDone ? " done" : "");
    row.innerHTML = `
      <td><span class="w">${w.word}<span class="n">${w.details.length}</span></span></td>
      <td class="m">${w.meaning}</td>
      <td class="s">${sumText}</td>
      <td class="lk"><a href="${firstV.url}" target="_blank" onclick="event.stopPropagation()">▶ 观看</a></td>`;
    row.onclick = ()=>{ open ? expanded.delete(w.word) : expanded.add(w.word); render(); };
    tb.appendChild(row);

    if(open){
      const det = document.createElement("tr");
      det.className = "detail";
      const blocks = w.details.map(d=>{
        const v = videoOf(d.videoId);
        return `
          <div class="d-block">
            <div class="d-head">
              <span class="dtitle">🎬《${v.title}》</span>
              <span class="pos">${w.pos}</span>
              <span class="ipa">${w.ipa}</span>
            </div>
            <div class="ex"><div class="en">${d.exampleEn}</div><div class="zh">${d.exampleZh}</div></div>
            ${d.note ? `<div class="note">💡 ${d.note}</div>` : ""}
            <div class="d-actions">
              <a href="${v.url}" target="_blank" style="font-size:12px;color:var(--primary);text-decoration:none;align-self:center">▶ 去抖音看这条讲解</a>
            </div>
          </div>`;
      }).join("");
      det.innerHTML = `<td colspan="4">
        ${blocks}
        <div class="d-actions">
          <button class="say-b">🔊 朗读单词</button>
          <button class="mb ${isDone?"mastered":""}">${isDone?"✓ 已掌握":"标记掌握"}</button>
        </div>
      </td>`;
      det.querySelector(".say-b").onclick = ()=> speak(w.word);
      det.querySelector(".mb").onclick = ()=>{ done[w.word] ? delete done[w.word] : done[w.word]=1; save(); render(); };
      tb.appendChild(det);
    }
  }
}

document.getElementById("search").addEventListener("input", e=>{ query=e.target.value; render(); });
document.querySelectorAll(".filters button").forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active"); filter=b.dataset.f; render();
  };
});
render();
</script>
</body>
</html>
